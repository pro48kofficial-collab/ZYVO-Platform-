<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVO</title><style>body{margin:0;background:#080a09;color:#eee;font:16px Arial}header{padding:14px 18px;background:#101410;display:flex;gap:15px;align-items:center;position:sticky;top:0}b{color:#b8ff3d;font-size:24px}button,input{padding:10px;border-radius:9px;border:1px solid #333;background:#151915;color:#fff}button{cursor:pointer}.wrap{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#121612;border:1px solid #252b25;border-radius:14px;padding:14px}.thumb{height:120px;background:#1d241d;border-radius:10px;display:grid;place-items:center;font-size:42px}.lime{color:#b8ff3d}.hidden{display:none}#game{height:55vh;background:#101610;border:1px solid #2d372d;position:relative;overflow:hidden}.player{position:absolute;font-size:32px;transform:translate(-50%,-50%)}.coin{color:#ffd84d}</style></head><body><header><b>ZYVO</b><button onclick="show('home')">Discover</button><button onclick="show('earn')">🪙 Coins</button><button onclick="show('shop')">Shop</button><span id="user"></span><button onclick="auth()">Login</button></header><main class="wrap"><section id="home"><h1>Discover</h1><div id="games" class="grid"></div></section><section id="earn" class="hidden"><h1>Earn Zyvo Coins</h1><div class="card"><h2>🪙 <span id="coins">0</span></h2><button onclick="daily()">🎁 Daily reward +100</button><p>Грай у ігри: до 120 коінів за ігровий час на день.</p><div id="history"></div></div></section><section id="shop" class="hidden"><h1>Avatar Shop</h1><div id="avatars" class="grid"></div></section><section id="play" class="hidden"><button onclick="show('home')">← Назад</button><h2 id="gameTitle"></h2><div id="game"></div><p>WASD / стрілки — рух. Інші гравці бачать твого стандартного ZYVO-персонажа.</p></section></main><script>let token=localStorage.zyvoToken,me=null,ws,players={};const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(o.body&&typeof o.body!='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(u,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Помилка');return j}async function load(){try{me=await api('/api/me');$('user').textContent='👤 '+me.username;$('coins').textContent=me.coins}catch{}let gs=await api('/api/games');$('games').innerHTML=gs.map(g=>`<div class=card><div class=thumb>${g.thumbnail||'🎮'}</div><h3>${g.title}</h3><p>${g.description||''}</p><p>👥 ${g.players||0} · ❤️ ${g.likes||0}</p><button onclick="play(${g.id})">Play</button> <button onclick="like(${g.id})">❤️</button></div>`).join('')};function show(x){['home','earn','shop','play'].forEach(s=>$(s).classList.toggle('hidden',s!==x));if(x==='earn')history()}async function auth(){let u=prompt('Нікнейм');if(!u)return;let p=prompt('Пароль');if(!p)return;try{let j=await api('/api/login',{method:'POST',body:{username:u,password:p}});token=j.token;localStorage.zyvoToken=token;load()}catch{try{let j=await api('/api/register',{method:'POST',body:{username:u,password:p}});token=j.token;localStorage.zyvoToken=token;load()}catch(e){alert(e.message)}}}async function daily(){try{let j=await api('/api/coins/daily',{method:'POST'});$('coins').textContent=j.coins;alert('+100 Zyvo Coins')}catch(e){alert(e.message)}}async function history(){if(!token)return;$('history').innerHTML=(await api('/api/transactions')).map(x=>`<p>${x.amount>0?'+':''}${x.amount} — ${x.kind}</p>`).join('')};function play(id){show('play');api('/api/games/'+id).then(g=>{ $('gameTitle').textContent=g.title;let w=g.world||[];$('game').innerHTML=w.map(o=>`<div class="player" style="left:${o.x||50}%;top:${o.y||50}%">${o.type==='Spawn'?'🟢':o.type==='Coin'?'🪙':'🧱'}</div>`).join('')+'<div id=me class=player>🧍</div>';connect(id)})}function connect(id){if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+id);let x=50,y=50;ws.onopen=()=>ws.send(JSON.stringify({type:'hello',username:me?.username||'Guest',avatar:me?.avatar||'🧍'}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='init')m.players.forEach(p=>players[p.id]=p);if(m.type==='join'||m.type==='update')players[m.player.id]=m.player;if(m.type==='leave')delete players[m.id];renderPlayers()};addEventListener('keydown',e=>{if(['ArrowUp','w'].includes(e.key))y-=3;if(['ArrowDown','s'].includes(e.key))y+=3;if(['ArrowLeft','a'].includes(e.key))x-=3;if(['ArrowRight','d'].includes(e.key))x+=3;x=Math.max(2,Math.min(98,x));y=Math.max(2,Math.min(98,y));ws?.send(JSON.stringify({type:'move',x,y}))})};function renderPlayers(){document.querySelectorAll('.netplayer').forEach(e=>e.remove());Object.values(players).forEach(p=>{let e=document.createElement('div');e.className='player netplayer';e.style.left=(p.x||50)+'%';e.style.top=(p.y||50)+'%';e.textContent=p.avatar||'🧍';$('game').append(e)})}async function like(id){try{await api('/api/games/'+id+'/like',{method:'POST'});load()}catch{}}const av=[['🧍',0],['😀',100],['😎',250],['🤖',500],['⚡',800],['👽',1200]];$('avatars').innerHTML=av.map(a=>`<div class=card><div class=thumb>${a[0]}</div><button onclick="buy('${a[0]}',${a[1]})">${a[1]?'Купити за '+a[1]:'Безкоштовно'}</button></div>`).join('');async function buy(a,p){try{let j=await api('/api/shop/buy-avatar',{method:'POST',body:{avatar:a,price:p}});$('coins').textContent=j.coins;alert('Аватар встановлено')}catch(e){alert(e.message)}}load();</script></body></html>
